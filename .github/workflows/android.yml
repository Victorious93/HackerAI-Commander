name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  debug-apk:
    name: Build & verify debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Expected signer of the DEBUG build (stable fleet debug keystore committed
      # to the repo). Release signing is handled separately and is not covered here.
      EXPECTED_SHA256: "AF:1C:8F:C5:44:9F:58:4A:46:C8:96:CC:C9:7F:35:B0:7B:35:7E:96:EE:66:5F:3A:BF:CB:0D:28:4D:F5:23:55"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK signer SHA-256
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No debug APK found"
            exit 1
          fi
          echo "APK: $APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)"
          echo "apksigner: $APKSIGNER"

          "$APKSIGNER" verify --print-certs "$APK"

          ACTUAL_RAW="$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}')"
          ACTUAL="$(echo "$ACTUAL_RAW" | tr 'a-f' 'A-F' | sed 's/\(..\)/\1:/g; s/:$//')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::Debug APK signer SHA-256 mismatch (expected $EXPECTED_SHA256, got $ACTUAL)"
            exit 1
          fi
          echo "Debug APK signer fingerprint matches."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
