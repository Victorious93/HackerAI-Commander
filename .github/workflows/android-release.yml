name: Android Release

on:
  push:
    tags:
      - "v*"
  # Manual runs are allowed so a release can be re-cut from a tag, but publishing
  # is still gated: it only produces a DRAFT release, and secrets are required.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v1.2.3)"
        required: true

# Default to read-only; the publishing job opts into contents: write explicitly.
permissions:
  contents: read

jobs:
  release-apk:
    name: Build, verify & draft-release the signed APK
    # Never run on forks (their secrets are empty and they can't publish here).
    if: github.repository == 'Victorious93/HackerAI-Commander'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required ONLY to create the draft release and upload the asset

    env:
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - name: Fail fast if signing secrets or expected fingerprint are missing
        run: |
          set -euo pipefail
          missing=0
          # Only check presence/emptiness — never print the values.
          [ -n "${ANDROID_RELEASE_KEYSTORE_B64:-}" ]   || { echo "::error::secret ANDROID_RELEASE_KEYSTORE_B64 is not set"; missing=1; }
          [ -n "${ANDROID_RELEASE_STORE_PASSWORD:-}" ] || { echo "::error::secret ANDROID_RELEASE_STORE_PASSWORD is not set"; missing=1; }
          [ -n "${ANDROID_RELEASE_KEY_ALIAS:-}" ]      || { echo "::error::secret ANDROID_RELEASE_KEY_ALIAS is not set"; missing=1; }
          [ -n "${ANDROID_RELEASE_KEY_PASSWORD:-}" ]   || { echo "::error::secret ANDROID_RELEASE_KEY_PASSWORD is not set"; missing=1; }
          [ -n "${EXPECTED_CERT_SHA256:-}" ]           || { echo "::error::variable ANDROID_RELEASE_CERT_SHA256 is not set"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "::error::missing release signing configuration"; exit 1; }
          echo "All required secrets and the expected-fingerprint variable are present."

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signer SHA-256
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found (did the signing secrets decode correctly?)"
            exit 1
          fi
          echo "APK: $APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" verify --print-certs "$APK"

          EXPECTED="$(echo "$EXPECTED_CERT_SHA256" | tr 'a-f' 'A-F' | tr -d ' ')"
          ACTUAL_RAW="$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}')"
          ACTUAL="$(echo "$ACTUAL_RAW" | tr 'a-f' 'A-F' | sed 's/\(..\)/\1:/g; s/:$//')"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release APK signer SHA-256 does not match ANDROID_RELEASE_CERT_SHA256"
            exit 1
          fi
          echo "Release APK signer fingerprint matches the shared fleet release key."

      - name: Stage release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          mkdir -p ../release-artifacts
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          cp "$APK" "../release-artifacts/hackerai-companion-${TAG}.apk"
          MAP="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then cp "$MAP" "../release-artifacts/mapping-${TAG}.txt"; fi
          ls -la ../release-artifacts

      - name: Upload R8 mapping as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: release-artifacts/mapping-*.txt
          if-no-files-found: warn

      - name: Create DRAFT GitHub release and attach the signed APK
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          name: ${{ github.event.inputs.ref || github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/hackerai-companion-*.apk
