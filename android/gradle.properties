# Project-wide Gradle settings for the HackerAI Android companion.
# AndroidX is required because the app depends on androidx.* artifacts.
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Gradle / Kotlin daemon JVM sizing
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
